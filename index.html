<script>
const questions = [
    "Est-ce que tu m'aimes ? ❤️",
    "Suis-je ton chéri préféré ? 🥰",
    "Est-ce que je suis beau ? 😎",
    "Veux-tu sortir avec moi ce week-end ? 🌹",
    "Veux-tu qu'on fasse plein de voyages ensemble ? ✈️",
    "Est-ce que je mérite un gros bisou ? 😘"
];

let current = 0;

function nextQuestion(){
    current++;

    if(current >= questions.length){
        document.querySelector('.card').innerHTML = `
            <h1>❤️ MOI AUSSI JE T'AIME ❤️</h1>
            <h2>P'TIT MOUKIX 😘</h2>
        `;
        return;
    }

    document.getElementById("question").innerText = questions[current];
}

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

let scale = 1;
let yesScale = 1;

noBtn.addEventListener("mouseover", () => {

    const x = Math.random() * 250 - 125;
    const y = Math.random() * 150 - 75;

    scale -= 0.08;
    if(scale < 0.1) scale = 0.1;

    yesScale += 0.08;

    noBtn.style.transform =
        `translate(${x}px, ${y}px) scale(${scale})`;

    yesBtn.style.transform =
        `scale(${yesScale})`;
});
</script>
