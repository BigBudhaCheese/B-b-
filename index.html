<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question très importante ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial,sans-serif;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    width:400px;
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
}

#yes{
    background:#4CAF50;
    color:white;
}

#no{
    background:#f44336;
    color:white;
    position:relative;
}
</style>
</head>
<body>

<div class="card">
    <h2 id="question">Est-ce que tu m'aimes ? ❤️</h2>

    <button id="yes" onclick="nextQuestion()">Oui</button>
    <button id="no">Non</button>
</div>

<script>

const questions = [
    "Est-ce que tu m'aimes ? ❤️",
    "Est-ce que je suis beau ? 😎",
    "Veux-tu sortir avec moi ce week-end ? 🌹",
    "Veux-tu qu'on fasse plein de voyages ensemble ? ✈️",
    "Est-ce que je mérite un gros bisou ? 😘"
];

let current = 0;

function nextQuestion(){
    current++;

    if(current >= questions.length){
        document.querySelector('.card').innerHTML =
        `<h1>❤️ Félicitations ❤️</h1>
        <p>Toutes les bonnes réponses étaient OUI 😘</p>`;
        return;
    }

    document.getElementById("question").innerText = questions[current];
}

const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 250 - 125;
    const y = Math.random() * 150 - 75;

    noBtn.style.transform =
        `translate(${x}px, ${y}px)`;
});
</script>

</body>
</html>
